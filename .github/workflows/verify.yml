name: Verify notes
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codes:
    name: Code / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [cpp, java, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: 'pypy3.11'
      - name: Verify examples and boundary cases
        run: python scripts/verify_codes.py --language ${{ matrix.language }}
  site:
    name: Site / build and content
    runs-on: ubuntu-24.04
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm run verify:site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
